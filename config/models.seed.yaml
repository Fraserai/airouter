# Seed model registry.
#
# SOURCE: Artificial Analysis Intelligence Index v4.2 snapshot, 6 Sep 2026.
#         https://artificialanalysis.ai/#intelligence
#
# THIS IS SEED DATA, NOT TRUTH (BRIEF.md §3 rule 1).
#   - `access` is transcribed from the source and is UNVERIFIED.
#   - `placement` is our own seed judgement and is UNVERIFIED.
#   - `pricing` is null everywhere. We do not guess prices.
#   - `verified: false` means INELIGIBLE FOR SELECTION. The router will not
#     route to any of these until `scripts/verify_registry.py` passes for them.
#
# Placement is a property of a DEPLOYMENT, not of a model. A model you can run
# both on your own hardware and via a hosted provider gets two entries with
# distinct ids (`<model>@local`, `<model>@cloud`). See FINDINGS.md.

