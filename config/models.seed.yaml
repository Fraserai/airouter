# Seed model registry.
#
# SOURCE: Artificial Analysis Intelligence Index v4.2 snapshot, 6 Sep 2026,
#         plus the companion "Cost per Intelligence Index Task" chart.
#         https://artificialanalysis.ai/#intelligence
#
# THIS IS SEED DATA, NOT TRUTH (BRIEF §3 rule 1).
#   - `access` and `placement` are transcribed/inferred and UNVERIFIED.
#   - `pricing` is null everywhere. We do not guess per-token prices.
#   - `benchmark.cost_per_task_usd` is NOT a price. It is a weighted average over
#     the index provider's task mix and only predicts your cost if your traffic
#     looks like their benchmark. Seeds priors and sanity-checks the harness;
#     never read by the selection path.
#   - `verified: false` means INELIGIBLE FOR SELECTION.
#
# THE ROUTABLE UNIT IS (model, effort), NOT model.
#   ids are `<family>@<placement>:<effort>`. `family` groups effort variants so
#   the escalator can turn the dial before switching families.
#   `effort` is the provider's own label. `effort_rank` supplies the ordering,
#   because the labels are vendor vocabulary with no universal order -- routing
#   logic compares ranks, never strings. See FINDINGS.md F007.
#   Ranks are only meaningful WITHIN a family.
#
# Placement is a property of a deployment, not a model (FINDINGS.md F005).

