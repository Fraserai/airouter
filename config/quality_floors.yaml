# Quality floors, per task class.
#
# HARD CONSTRAINT. Not negotiable at runtime. Cost is minimised SUBJECT TO this.
# A request that cannot meet its floor returns an explicit error; it is never
# silently served below floor. (BRIEF.md §5, PLAN.md Q6)
#
# Two kinds of floor:
#   `capability`  - minimum score on named evals. Deterministic, cheap.
#   `noninferiority` - for open-ended work with no test suite or schema:
#                   win/tie rate vs a reference response must be >= theta,
#                   measured by a sampled, blinded, cross-lab judge. (PLAN.md Q1)

defaults:
  judge_sample_rate: 0.02
  judge_stratify_on: [low_confidence, near_floor, escalated]

task_classes:
  code_generation:
    capability: {terminal_bench_v2_1: 40, scicode: 35}
    gates: [syntax_valid, compiles, tests_pass]
    noninferiority: {theta: 0.45}

  structured_extraction:
    capability: {aa_briefcase: 35}
    gates: [schema_valid, json_parses]
    noninferiority: null       # schema validity is the floor; no judge needed

  long_context_retrieval:
    capability: {aa_lcr_v1_1: 45}
    gates: [citation_present]
    noninferiority: {theta: 0.45}

  reasoning_analysis:
    capability: {hle: 30, critpt: 30}
    gates: [self_consistency]
    noninferiority: {theta: 0.45}

  open_ended_generation:
    capability: {}
    gates: []
    noninferiority: {theta: 0.45}    # the only floor available here

  conversational_simple:
    capability: {}
    gates: []
    noninferiority: {theta: 0.40}

  agentic_tool_use:
    capability: {tau3_banking: 35, terminal_bench_v2_1: 35}
    gates: [tool_call_wellformed, schema_valid]
    noninferiority: {theta: 0.45}
