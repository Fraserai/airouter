# Model Router: one frontier routing brain, one shared model pool, one API.
# auto selects the highest-ranked catalog model; benchmark cost breaks ties.
# Its deployment must be configured and verified before live routing works.
router:
  intelligence_model: auto
auth:
  enabled: false
  api_key_env: ROUTER_GATEWAY_API_KEY
runtime_routing:
  enabled: true
  leader_max_output_tokens: 2048
  max_digest_tokens: 2000
  digest_head_chars: 3200
  digest_tail_chars: 3200
  default_max_tokens: 1024
  placement_preference: []
  max_consult_cost_usd: 0.5
development:
  fixed_model: dev-stub@stub:default
providers:
  openai:
    adapter: chat_api
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    timeout_s: 60
    default_max_tokens: 1024
  openrouter:
    adapter: chat_api
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    optional: true
    timeout_s: 60
    default_max_tokens: 1024
    include_unverified: true
ledger:
  path: data/requests.sqlite3
